[package]
name = "sonic-launcher-verify"
version = "0.1.0"
edition = "2021"

# Standalone verification crate: tests the pure (Tauri-free) logic of
# Phases 2-5 plus the db.rs SQLite schema/queries. The real Tauri crate
# cannot compile on this VM (no gdk-3.0); first real compile is on the
# server. This crate is NOT part of the Tauri build.

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"

[lib]
name = "sonic_launcher_verify"
path = "src/lib.rs"
