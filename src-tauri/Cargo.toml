[package]
name = "sonic-launcher"
version = "0.1.0"
description = "Sonic Launcher - a PS5-style game launcher (Tauri 2 + Rust)"
authors = ["Mohand Kandil"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
open = "5"
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
